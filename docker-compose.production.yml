name: rezo-taxi-core

x-app-build: &app-build
  context: .
  dockerfile: Dockerfile

x-app-env: &app-env
  FLASK_APP: "APITaxi"
  PYTHONPATH: "/app"
  SECRET_KEY: "${SECRET_KEY:?Set SECRET_KEY in the compose env file}"
  SECURITY_PASSWORD_SALT: "${SECURITY_PASSWORD_SALT:?Set SECURITY_PASSWORD_SALT in the compose env file}"
  SQLALCHEMY_DATABASE_URI: "${SQLALCHEMY_DATABASE_URI:?Set SQLALCHEMY_DATABASE_URI in the compose env file}"
  REDIS_URL: "${REDIS_URL:?Set REDIS_URL in the compose env file}"
  CELERY_BROKER_URL: "${CELERY_BROKER_URL:?Set CELERY_BROKER_URL in the compose env file}"
  CELERY_RESULT_BACKEND: "${CELERY_RESULT_BACKEND:?Set CELERY_RESULT_BACKEND in the compose env file}"
  INTERNAL_HEALTHCHECK_KEY: "${INTERNAL_HEALTHCHECK_KEY:?Set INTERNAL_HEALTHCHECK_KEY in the compose env file}"
  CORS_ALLOWED_ORIGINS: "${CORS_ALLOWED_ORIGINS:-}"
  OBSERVABILITY_REQUEST_LOGS_ENABLED: "${OBSERVABILITY_REQUEST_LOGS_ENABLED:-true}"
  OBSERVABILITY_METRICS_ENABLED: "${OBSERVABILITY_METRICS_ENABLED:-true}"
  SENTRY_DSN: "${SENTRY_DSN:-}"
  SENTRY_SAMPLE_RATE: "${SENTRY_SAMPLE_RATE:-0.1}"
  HTTP_CONNECT_TIMEOUT: "${HTTP_CONNECT_TIMEOUT:-3.05}"
  HTTP_READ_TIMEOUT: "${HTTP_READ_TIMEOUT:-10.0}"
  REVERSE_GEOCODE_HTTP_CONNECT_TIMEOUT: "${REVERSE_GEOCODE_HTTP_CONNECT_TIMEOUT:-2.0}"
  REVERSE_GEOCODE_HTTP_READ_TIMEOUT: "${REVERSE_GEOCODE_HTTP_READ_TIMEOUT:-4.0}"
  OPERATOR_API_HTTP_CONNECT_TIMEOUT: "${OPERATOR_API_HTTP_CONNECT_TIMEOUT:-3.05}"
  OPERATOR_API_HTTP_READ_TIMEOUT: "${OPERATOR_API_HTTP_READ_TIMEOUT:-10.0}"
  DOWNLOAD_HTTP_CONNECT_TIMEOUT: "${DOWNLOAD_HTTP_CONNECT_TIMEOUT:-5.0}"
  DOWNLOAD_HTTP_READ_TIMEOUT: "${DOWNLOAD_HTTP_READ_TIMEOUT:-120.0}"
  CLIENT_HTTP_CONNECT_TIMEOUT: "${CLIENT_HTTP_CONNECT_TIMEOUT:-3.05}"
  CLIENT_HTTP_READ_TIMEOUT: "${CLIENT_HTTP_READ_TIMEOUT:-10.0}"
  REZO_TAXI_RADIUS_MIN_METERS: "${REZO_TAXI_RADIUS_MIN_METERS:-500}"
  REZO_TAXI_RADIUS_DEFAULT_METERS: "${REZO_TAXI_RADIUS_DEFAULT_METERS:-5000}"
  REZO_TAXI_RADIUS_MAX_METERS: "${REZO_TAXI_RADIUS_MAX_METERS:-30000}"
  REZO_TAXI_GPS_FRESHNESS_SECONDS: "${REZO_TAXI_GPS_FRESHNESS_SECONDS:-180}"
  REZO_TAXI_DRIVER_ACCEPTANCE_TIMEOUT_SECONDS: "${REZO_TAXI_DRIVER_ACCEPTANCE_TIMEOUT_SECONDS:-120}"
  REZO_TAXI_CUSTOMER_CONFIRMATION_TIMEOUT_SECONDS: "${REZO_TAXI_CUSTOMER_CONFIRMATION_TIMEOUT_SECONDS:-60}"
  REZO_TAXI_SEARCH_DISPLAY_LIMIT: "${REZO_TAXI_SEARCH_DISPLAY_LIMIT:-8}"
  REZO_TAXI_SEARCH_CANDIDATE_LIMIT: "${REZO_TAXI_SEARCH_CANDIDATE_LIMIT:-20}"
  REZO_TAXI_LONG_WAIT_THRESHOLD_SECONDS: "${REZO_TAXI_LONG_WAIT_THRESHOLD_SECONDS:-900}"
  REZO_TAXI_OPERATOR_ACK_TIMEOUT_SECONDS: "${REZO_TAXI_OPERATOR_ACK_TIMEOUT_SECONDS:-30}"
  REZO_TAXI_SEND_OPERATOR_MAX_DELAY_SECONDS: "${REZO_TAXI_SEND_OPERATOR_MAX_DELAY_SECONDS:-30}"
  REZO_TAXI_PICKUP_TIMEOUT_SECONDS: "${REZO_TAXI_PICKUP_TIMEOUT_SECONDS:-900}"
  REZO_TAXI_RIDE_TIMEOUT_SECONDS: "${REZO_TAXI_RIDE_TIMEOUT_SECONDS:-7200}"
  REZO_TAXI_INTERNAL_OPERATOR_HANDOFF_ENABLED: "${REZO_TAXI_INTERNAL_OPERATOR_HANDOFF_ENABLED:-false}"
  REZO_TAXI_INTERNAL_OPERATOR_EMAILS: "${REZO_TAXI_INTERNAL_OPERATOR_EMAILS:-}"
  GUNICORN_BIND: "${GUNICORN_BIND:-0.0.0.0:5000}"
  GUNICORN_WORKERS: "${GUNICORN_WORKERS:-2}"
  GUNICORN_WORKER_CLASS: "${GUNICORN_WORKER_CLASS:-gthread}"
  GUNICORN_THREADS: "${GUNICORN_THREADS:-4}"
  GUNICORN_TIMEOUT: "${GUNICORN_TIMEOUT:-30}"
  GUNICORN_GRACEFUL_TIMEOUT: "${GUNICORN_GRACEFUL_TIMEOUT:-30}"
  GUNICORN_KEEPALIVE: "${GUNICORN_KEEPALIVE:-5}"
  GUNICORN_FORWARDED_ALLOW_IPS: "${GUNICORN_FORWARDED_ALLOW_IPS:-127.0.0.1}"
  GUNICORN_LOG_LEVEL: "${GUNICORN_LOG_LEVEL:-info}"
  FAKE_TAXI_ID: "${FAKE_TAXI_ID:-true}"
  NEUTRAL_OPERATOR: "${NEUTRAL_OPERATOR:-false}"
  CONSOLE_URL: "${CONSOLE_URL:-}"
  SWAGGER_URL: "${SWAGGER_URL:-}"

x-app-depends-on: &app-depends-on
  taxi-postgres:
    condition: service_healthy
  taxi-redis:
    condition: service_healthy

services:
  taxi-postgres:
    image: timescale/timescaledb-ha:pg14-ts2.9-latest
    restart: unless-stopped
    environment:
      POSTGRES_DB: "${POSTGRES_DB:?Set POSTGRES_DB in the compose env file}"
      POSTGRES_USER: "${POSTGRES_USER:?Set POSTGRES_USER in the compose env file}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the compose env file}"
    volumes:
      - taxi-postgres-data:/home/postgres/pgdata/data
      - ./devenv/postgres-init/999_rezo_extensions.sql:/docker-entrypoint-initdb.d/999_rezo_extensions.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER:-apitaxi}\" -d \"$${POSTGRES_DB:-apitaxi}\""]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  taxi-redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--save", "60", "1000"]
    volumes:
      - taxi-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  taxi-web:
    image: rezo-taxi-core-web:${REZO_TAXI_CORE_IMAGE_TAG:-local}
    build:
      <<: *app-build
      target: web
    restart: unless-stopped
    environment: *app-env
    depends_on: *app-depends-on
    networks:
      default: {}
      rezo-internal:
        aliases:
          - rezo-taxi-core-web
    healthcheck:
      test:
        - CMD-SHELL
        - >
          python3 -c "import os, urllib.request;
          key = os.environ.get('INTERNAL_HEALTHCHECK_KEY', '');
          req = urllib.request.Request(
            'http://127.0.0.1:5000/internal/health',
            headers={'X-Internal-Key': key}
          );
          urllib.request.urlopen(req, timeout=3).read()"
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s

  taxi-worker:
    image: rezo-taxi-core-worker:${REZO_TAXI_CORE_IMAGE_TAG:-local}
    build:
      <<: *app-build
      target: worker
    restart: unless-stopped
    environment: *app-env
    depends_on: *app-depends-on
    healthcheck:
      test: ["CMD-SHELL", "celery --app=APITaxi2.celery_worker inspect ping --timeout=5 | grep -q pong"]
      interval: 30s
      timeout: 10s
      retries: 6
      start_period: 120s

  taxi-beat:
    image: rezo-taxi-core-beat:${REZO_TAXI_CORE_IMAGE_TAG:-local}
    build:
      <<: *app-build
      target: beat
    restart: unless-stopped
    environment: *app-env
    depends_on: *app-depends-on
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/celery-beat.pid && kill -0 $(cat /tmp/celery-beat.pid)"]
      interval: 30s
      timeout: 10s
      retries: 6
      start_period: 120s

  taxi-migrate:
    profiles: ["tools"]
    image: rezo-taxi-core-web:${REZO_TAXI_CORE_IMAGE_TAG:-local}
    build:
      <<: *app-build
      target: web
    environment: *app-env
    depends_on: *app-depends-on
    command: ["bash", "-lc", "cd APITaxi_models2 && alembic current && alembic upgrade head && alembic current"]

volumes:
  taxi-postgres-data:
  taxi-redis-data:

networks:
  rezo-internal:
    external: true
