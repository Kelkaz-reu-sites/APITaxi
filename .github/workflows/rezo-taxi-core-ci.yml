name: Rezo Taxi Core CI

on:
  push:
    branches:
      - main
      - master
      - "rezo/**"
  pull_request:
  schedule:
    - cron: "43 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rezo-taxi-core-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate sources and dependency audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Install audit tooling
        run: python -m pip install "pip-audit==2.10.1"

      - name: Check Docker Compose configuration
        run: docker compose config >/tmp/rezo-taxi-compose.yml

      - name: Compile Python sources
        run: python -m compileall -q APITaxi APITaxi2 APITaxi_models2 deploy/conf

      - name: Audit Python dependencies
        run: pip-audit -r requirements.lock --strict --require-hashes

      - name: Check encrypted backup configuration guards
        run: |
          bash -n deploy/backup_taxi_core.sh
          python3 -B -m unittest discover -s deploy -p test_backup_taxi_core.py

      - name: Check isolated database migration and cutover guards
        run: |
          bash -n deploy/maintenance/test_postgres_upgrade.sh
          python3 -B -m unittest discover -s deploy/maintenance -p 'test_*.py'

  tests:
    name: Run APITaxi test suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Prepare workspace for Docker test user
        run: sudo chmod -R a+rwX .

      - name: Run tests in Docker
        run: docker compose --profile test run --rm taxi-test

      - name: Restore workspace ownership
        if: always()
        run: sudo chown -R "$USER:$USER" .

      - name: Stop containers
        if: always()
        run: docker compose --profile test down -v --remove-orphans

  docker-builds:
    name: Build production targets
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Add harmless secret-file sentinels to the build context
        run: |
          printf '%s\n' 'BUILD_CONTEXT_SENTINEL=not-a-secret' > .env
          mkdir -p .secrets
          printf '%s\n' 'not-a-secret' > .secrets/build-context-sentinel

      - name: Build web image
        run: docker build --target web -t rezo-taxi-core-web:test .

      - name: Verify secret files are absent from the application image
        run: >-
          docker run --rm --network none --entrypoint /bin/sh
          rezo-taxi-core-web:test
          -c 'test ! -e /app/.env && test ! -e /app/.secrets'

      - name: Verify locked runtime without build tools or missing native libraries
        run: >-
          docker run --rm --network none --entrypoint /venv/bin/python
          rezo-taxi-core-web:test -B /app/deploy/check_runtime.py

      - name: Build worker image
        run: docker build --target worker -t rezo-taxi-core-worker:test .

      - name: Build beat image
        run: docker build --target beat -t rezo-taxi-core-beat:test .
