name: Maintenance freshness and support dates

on:
  schedule:
    - cron: '43 10 * * *'
  workflow_dispatch:
  pull_request:
    paths:
      - scripts/maintenance/**
      - .github/workflows/maintenance.yml
      - .github/dependabot.yml

permissions:
  contents: read
  actions: read

jobs:
  maintenance:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Test maintenance checks without network or notifications
        run: |
          python3 -B scripts/maintenance/test_check_maintenance.py
          python3 -B scripts/maintenance/test_image_inventory.py
      - name: Verify dates, audit freshness, update queue and dependency graph
        # Pull requests validate the checker without repository credentials.
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -B scripts/maintenance/check_maintenance.py
